name = "skein-api"
main = "src/worker.js"
compatibility_date = "2026-05-09"

[vars]
ANTHROPIC_MODEL = "claude-sonnet-4-6"
ALLOWED_ORIGINS = "https://skein-diagnostic.netlify.app,https://skein.netlify.app,http://localhost:8000,http://127.0.0.1:8000,http://localhost:8888,http://127.0.0.1:8888"

# ANTHROPIC_API_KEY:
#   local dev → put it in .dev.vars (gitignored)
#   production → wrangler secret put ANTHROPIC_API_KEY

# Per-IP rate limiting — Cloudflare native Rate Limiting binding (no external resource).
# 20 requests / 60s per client IP on /extract + /narrate. Worker fails open if absent.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
